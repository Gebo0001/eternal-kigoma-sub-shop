<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETERNAL KIGOMA SUB SHOP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--surface:#13131a;--surface2:#1c1c28;--border:#2a2a3d;--accent:#7c6aff;--accent2:#ff6a9b;--accent3:#6affd4;--text:#e8e8f0;--muted:#6b6b8a;--gold:#ffd066}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
.hidden{display:none!important}
.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.spinner{width:48px;height:48px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 20% 50%,#1a0a3d 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,#0d2a1f 0%,transparent 50%),var(--bg);padding:20px}
.auth-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px;width:100%;max-width:460px;box-shadow:0 40px 80px rgba(0,0,0,.5)}
.auth-logo{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.auth-sub{color:var(--muted);font-size:14px;margin-bottom:24px}
.tabs{display:flex;gap:4px;background:var(--surface2);border-radius:10px;padding:4px;margin-bottom:24px}
.tab{flex:1;padding:10px;border:none;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;background:transparent;color:var(--muted);transition:all .2s}
.tab.active{background:var(--accent);color:#fff}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.field input,.field select{width:100%;padding:12px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;transition:border .2s;outline:none}
.field input:focus,.field select:focus{border-color:var(--accent)}
.field select option{background:var(--surface2)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .field{flex:1;min-width:160px}
.btn{width:100%;padding:13px;border:none;border-radius:10px;cursor:pointer;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;transition:opacity .2s;margin-top:6px}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{width:auto;padding:7px 14px;font-size:12px;border-radius:8px;margin-top:0;background:var(--accent)}
.btn-danger{background:linear-gradient(135deg,#ff4444,#ff6a9b)}
.btn-success{background:linear-gradient(135deg,#22c55e,var(--accent3));color:#000}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.err{color:var(--accent2);font-size:13px;margin-top:8px;text-align:center}
.suc{color:var(--accent3);font-size:13px;margin-top:8px;text-align:center}
.layout{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:24px 0;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar-logo{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;padding:0 20px;margin-bottom:28px;line-height:1.3}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 20px;cursor:pointer;color:var(--muted);font-size:14px;font-weight:500;transition:all .2s;border-left:3px solid transparent}
.nav-item:hover{color:var(--text);background:var(--surface2)}
.nav-item.active{color:var(--accent);border-left-color:var(--accent);background:rgba(124,106,255,.08)}
.nav-icon{font-size:16px;width:22px;text-align:center}
.sidebar-bottom{margin-top:auto;padding:0 16px}
.user-chip{background:var(--surface2);border-radius:12px;padding:12px;font-size:13px;margin-bottom:10px}
.user-chip .name{font-weight:600;color:var(--text)}
.user-chip .code{color:var(--accent);font-size:11px;margin-top:2px}
.user-chip .role{color:var(--gold);font-size:10px;text-transform:uppercase;letter-spacing:1px}
.main{flex:1;padding:28px;overflow-y:auto}
.page-title{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;margin-bottom:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px}
.card-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.card-value{font-family:'Syne',sans-serif;font-size:28px;font-weight:800}
.purple{color:var(--accent)}.pink{color:var(--accent2)}.green{color:var(--accent3)}.gold{color:var(--gold)}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;overflow-x:auto;margin-bottom:20px}
.table-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.table-title{font-family:'Syne',sans-serif;font-weight:700;font-size:15px}
table{width:100%;border-collapse:collapse;min-width:500px}
th{padding:10px 16px;text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
td{padding:12px 16px;font-size:13px;border-bottom:1px solid rgba(42,42,61,.5)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}
.pv-tag{display:inline-block;padding:3px 10px;border-radius:20px;background:rgba(106,255,212,.1);color:var(--accent3);font-size:12px;font-weight:600}
.tree-wrap{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;overflow:auto}
.t-level{display:flex;justify-content:center;gap:32px;position:relative}
.t-node{display:flex;flex-direction:column;align-items:center;position:relative}
.t-circle{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:18px;color:#fff;border:3px solid rgba(124,106,255,.5);transition:all .2s;box-shadow:0 4px 20px rgba(124,106,255,.3);cursor:pointer;position:relative;flex-shrink:0}
.t-circle:hover{transform:scale(1.1);border-color:var(--accent)}
.t-circle.t-self{border-color:var(--gold);box-shadow:0 4px 24px rgba(255,208,102,.4)}
.t-circle.t-admin{border-color:var(--gold);box-shadow:0 4px 24px rgba(255,208,102,.5)}
.t-label{text-align:center;margin-top:8px;width:90px}
.t-name{font-size:11px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-id{font-size:10px;color:var(--accent);margin-top:2px}
.t-popup{display:none;position:absolute;top:-80px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--accent);border-radius:10px;padding:8px 14px;font-size:11px;white-space:nowrap;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.6);min-width:140px;text-align:center}
.t-popup.show{display:block}
.t-vert{width:2px;height:24px;background:var(--border);margin:0 auto}
.t-horiz-wrap{display:flex;position:relative;justify-content:center}
.t-horiz{height:2px;background:var(--border);position:absolute;top:0}
.t-children{display:flex;justify-content:center;gap:32px;margin-top:0}
.t-branch{display:flex;flex-direction:column;align-items:center}
.t-branch-vert{width:2px;height:24px;background:var(--border)}
.pv-form{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:20px}
.pv-form h3{font-family:'Syne',sans-serif;font-weight:700;margin-bottom:14px}
.info-box{padding:12px 16px;background:rgba(124,106,255,.1);border-radius:10px;font-size:13px;margin-top:12px}
.section-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.empty{text-align:center;padding:32px;color:var(--muted);font-size:14px}
@media(max-width:700px){.sidebar{width:200px}.main{padding:16px}.cards{grid-template-columns:1fr 1fr}}
@media(max-width:500px){.layout{flex-direction:column}.sidebar{width:100%;height:auto;position:relative;padding:12px}.sidebar-bottom{display:none}.nav-item{padding:8px 12px;font-size:12px}.main{padding:12px}}

.view-btn{padding:9px 18px;border:1px solid var(--border);border-radius:20px;cursor:pointer;font-size:13px;font-weight:600;background:var(--surface2);color:var(--muted);transition:all .2s;font-family:'DM Sans',sans-serif}
.view-btn:hover{border-color:var(--accent);color:var(--accent)}
.active-view{background:var(--accent);color:#fff;border-color:var(--accent)}
.node-card{display:inline-flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin:5px 0}
.node-card.self{border-color:var(--accent);background:rgba(124,106,255,.1)}
.node-card.admin-node{border-color:var(--gold);background:rgba(255,208,102,.05)}
.node-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:700;font-size:12px;color:#fff;flex-shrink:0}
.node-name{font-weight:600;font-size:13px}
.node-code{font-size:11px;color:var(--accent)}
.node-pv{font-size:11px;color:var(--muted);margin-top:2px}
.tree-children{border-left:2px solid var(--border);margin-left:16px;padding-left:14px}
.toggle-btn{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:11px;cursor:pointer;color:var(--muted);margin-left:8px}
.toggle-btn:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>

<div id="loading-screen" class="loading">
  <div class="spinner"></div>
  <div style="color:var(--muted);font-size:14px">Inapakia...</div>
</div>

<div id="auth-screen" class="auth-wrap hidden">
  <div class="auth-box">
    <div class="auth-logo">ETERNAL KIGOMA SUB SHOP</div>
    <div class="auth-sub">Digital Marketing Platform</div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Ingia</button>
      <button class="tab" onclick="switchTab('register')">Jisajili</button>
    </div>
    <div id="login-form">
      <div class="field"><label>Namba ya Mwanachama</label><input id="l-member" placeholder="Mfano: 1214387" /></div>
      <div class="field"><label>Password</label><input id="l-pass" type="password" placeholder="••••••••" /></div>
      <div id="l-err" class="err hidden"></div>
      <button class="btn" id="login-btn" onclick="doLogin()">Ingia</button>
      <div style="text-align:center;margin-top:12px;font-size:12px;color:var(--muted)">Admin: Namba <strong>1214387</strong> / Password: <strong>admin123</strong></div>
    </div>
    <div id="register-form" class="hidden">
      <div class="row">
        <div class="field"><label>Jina Kamili</label><input id="r-name" placeholder="John Doe" /></div>
        <div class="field"><label>Namba ya Mwanachama</label><input id="r-member" placeholder="MEM001" /></div>
      </div>
      <div class="row">
        <div class="field"><label>Namba ya Simu</label><input id="r-phone" placeholder="0700000000" /></div>
        <div class="field"><label>Namba ya Passport</label><input id="r-passport" placeholder="A1234567" /></div>
      </div>
      <div class="field"><label>Code ya Sponsor (aliyekuleta)</label><input id="r-sponsor" placeholder="Mfano: GEBO0001" /></div>
      <div class="row">
        <div class="field"><label>Password</label><input id="r-pass" type="password" placeholder="••••••••" /></div>
        <div class="field"><label>Thibitisha Password</label><input id="r-pass2" type="password" placeholder="••••••••" /></div>
      </div>
      <div id="r-err" class="err hidden"></div>
      <div id="r-suc" class="suc hidden"></div>
      <button class="btn" id="register-btn" onclick="doRegister()">Jisajili</button>
    </div>
  </div>
</div>

<div id="app-screen" class="layout hidden">
  <div class="sidebar">
    <div class="sidebar-logo">ETERNAL KIGOMA SUB SHOP</div>
    <div id="nav-items"></div>
    <div class="sidebar-bottom">
      <div class="user-chip">
        <div class="name" id="sb-name"></div>
        <div class="code" id="sb-code"></div>
        <div class="role" id="sb-role"></div>
      </div>
      <button class="btn btn-outline" style="width:100%;padding:9px;font-size:13px" onclick="doLogout()">Toka ↗</button>
    </div>
  </div>
  <div class="main" id="main-content"></div>
</div>

<script>
// ============ SUPABASE SETUP ============
const SUPA_URL = 'https://wrnlrceicubeafagmpjs.supabase.co';
const SUPA_KEY = 'sb_publishable_fINfr0H44Dh0GNNW3Hh4WA_LlejHvrx';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

function genCode(name){return name.substring(0,3).toUpperCase()+Math.random().toString(36).substring(2,6).toUpperCase()}

// ============ DATABASE SETUP ============
async function setupDB(){
  // Create tables via SQL using RPC — we use REST API directly
  // Tables: users, pv_records
  // We'll check if admin exists, if not create
  try {
    const {data, error} = await sb.from('users').select('id').eq('role','admin').limit(1);
    if(error && error.code === '42P01'){
      // Table doesn't exist — show setup message
      showSetupNeeded();
      return false;
    }
    if(!data || data.length === 0){
      // Create admin
      await sb.from('users').insert({
        full_name: 'Mr. Gebo',
        member_number: '1214387',
        password: 'admin123',
        phone: '0672949116',
        passport: 'ADMIN001',
        code: 'GEBO0001',
        sponsor_code: null,
        role: 'admin'
      });
    }
    return true;
  } catch(e){
    showSetupNeeded();
    return false;
  }
}

function showSetupNeeded(){
  document.getElementById('loading-screen').innerHTML = `
    <div style="max-width:500px;padding:32px;text-align:center">
      <div style="font-family:Syne,sans-serif;font-size:22px;font-weight:800;color:var(--accent);margin-bottom:16px">Hatua Moja Zaidi! ⚙️</div>
      <div style="color:var(--muted);font-size:14px;margin-bottom:24px">Tunahitaji kuunda database tables kwanza. Nenda Supabase na fanya hivi:</div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:left;margin-bottom:20px">
        <div style="font-size:12px;color:var(--accent);margin-bottom:8px;font-weight:700">1. Nenda: supabase.com/dashboard</div>
        <div style="font-size:12px;color:var(--accent);margin-bottom:8px;font-weight:700">2. Bonyeza project yako</div>
        <div style="font-size:12px;color:var(--accent);margin-bottom:8px;font-weight:700">3. Bonyeza "SQL Editor" upande wa kushoto</div>
        <div style="font-size:12px;color:var(--accent);font-weight:700">4. Nakili SQL hapa chini, bandika, bonyeza "Run"</div>
      </div>
      <textarea id="sql-box" readonly style="width:100%;height:200px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:11px;padding:12px;font-family:monospace;resize:none">${getSQL()}</textarea>
      <button class="btn" style="margin-top:12px" onclick="location.reload()">Nimemaliza - Endelea ✅</button>
    </div>`;
}

function getSQL(){
  return `CREATE TABLE IF NOT EXISTS users (
  id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
  full_name text NOT NULL,
  member_number text UNIQUE NOT NULL,
  password text NOT NULL,
  phone text,
  passport text UNIQUE,
  code text UNIQUE NOT NULL,
  sponsor_code text,
  role text DEFAULT 'member',
  created_at timestamptz DEFAULT now()
);

CREATE TABLE IF NOT EXISTS pv_records (
  id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
  user_id uuid REFERENCES users(id),
  amount integer NOT NULL,
  note text,
  added_by text,
  created_at timestamptz DEFAULT now()
);

ALTER TABLE users DISABLE ROW LEVEL SECURITY;
ALTER TABLE pv_records DISABLE ROW LEVEL SECURITY;

INSERT INTO users (full_name,member_number,password,phone,passport,code,sponsor_code,role)
VALUES ('Mr. Gebo','1214387','admin123','0672949116','ADMIN001','GEBO0001',NULL,'admin')
ON CONFLICT (member_number) DO NOTHING;`;
}

// ============ AUTH ============
let currentUser = null;

function switchTab(tab){
  document.getElementById('login-form').classList.toggle('hidden', tab!=='login');
  document.getElementById('register-form').classList.toggle('hidden', tab!=='register');
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',(i===0&&tab==='login')||(i===1&&tab==='register')));
}

function showEl(id,msg){const el=document.getElementById(id);el.textContent=msg;el.classList.remove('hidden')}
function hideEl(id){document.getElementById(id).classList.add('hidden')}

async function doLogin(){
  hideEl('l-err');
  const member = document.getElementById('l-member').value.trim();
  const pass = document.getElementById('l-pass').value;
  if(!member||!pass) return showEl('l-err','Jaza namba na password');
  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'Inaingia...';
  const {data, error} = await sb.from('users').select('*').eq('member_number', member).eq('password', pass).single();
  btn.disabled = false; btn.textContent = 'Ingia';
  if(error || !data) return showEl('l-err','Namba ya Mwanachama au Password si sahihi');
  currentUser = data;
  sessionStorage.setItem('mlm_user', JSON.stringify(data));
  loadApp(data);
}

async function doRegister(){
  hideEl('r-err'); hideEl('r-suc');
  const name = document.getElementById('r-name').value.trim();
  const member = document.getElementById('r-member').value.trim().toUpperCase();
  const phone = document.getElementById('r-phone').value.trim();
  const passport = document.getElementById('r-passport').value.trim().toUpperCase();
  const sponsor = document.getElementById('r-sponsor').value.trim().toUpperCase();
  const pass = document.getElementById('r-pass').value;
  const pass2 = document.getElementById('r-pass2').value;
  if(!name||!member||!phone||!passport||!sponsor||!pass||!pass2) return showEl('r-err','Jaza sehemu zote');
  if(pass !== pass2) return showEl('r-err','Password hazifanani');
  if(pass.length < 6) return showEl('r-err','Password iwe na herufi 6+');
  const btn = document.getElementById('register-btn');
  btn.disabled = true; btn.textContent = 'Inasajili...';
  // Check sponsor exists
  const {data: sp} = await sb.from('users').select('id,code').eq('code', sponsor).single();
  if(!sp){btn.disabled=false;btn.textContent='Jisajili';return showEl('r-err','Code ya Sponsor si sahihi')}
  // Check member number not taken
  const {data: ex} = await sb.from('users').select('id').eq('member_number', member).single();
  if(ex){btn.disabled=false;btn.textContent='Jisajili';return showEl('r-err','Namba ya Mwanachama hii tayari ipo')}
  const {data: newUser, error} = await sb.from('users').insert({
    full_name: name, member_number: member, phone, passport,
    password: pass, sponsor_code: sponsor, code: genCode(name), role: 'member'
  }).select().single();
  btn.disabled = false; btn.textContent = 'Jisajili';
  if(error) return showEl('r-err','Hitilafu: '+error.message);
  showEl('r-suc', `Umesajiliwa! Ingia kwa Namba: ${member} ✅`);
  ['r-name','r-member','r-phone','r-passport','r-sponsor','r-pass','r-pass2'].forEach(id=>document.getElementById(id).value='');
}

function doLogout(){
  sessionStorage.removeItem('mlm_user');
  currentUser = null;
  location.reload();
}

// ============ APP ============
let currentPage = 'dashboard';

function loadApp(user){
  currentUser = user;
  document.getElementById('auth-screen').classList.add('hidden');
  document.getElementById('app-screen').classList.remove('hidden');
  document.getElementById('sb-name').textContent = user.full_name;
  document.getElementById('sb-code').textContent = user.code;
  document.getElementById('sb-role').textContent = user.role==='admin' ? '👑 Admin' : '🔵 Member';
  buildNav();
  renderPage('dashboard');
}

function buildNav(){
  const isAdmin = currentUser.role === 'admin';
  const navs = isAdmin ? [
    {id:'dashboard',icon:'📊',label:'Dashboard'},
    {id:'network',icon:'🌐',label:'Network Yote'},
    {id:'members',icon:'👥',label:'Wanachama'},
    {id:'addpv',icon:'➕',label:'Ongeza PV'},
  ] : [
    {id:'dashboard',icon:'📊',label:'Dashboard'},
    {id:'team',icon:'🌳',label:'Team Yangu'},
  ];
  document.getElementById('nav-items').innerHTML = navs.map(n=>
    `<div class="nav-item ${n.id===currentPage?'active':''}" onclick="renderPage('${n.id}')" id="nav-${n.id}"><span class="nav-icon">${n.icon}</span>${n.label}</div>`
  ).join('');
}

async function renderPage(page){
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  const navEl = document.getElementById('nav-'+page);
  if(navEl) navEl.classList.add('active');
  const main = document.getElementById('main-content');
  main.innerHTML = '<div class="empty">Inapakia...</div>';
  if(page==='dashboard') await showDashboard();
  else if(page==='team') await showTeam();
  else if(page==='network') await showNetwork();
  else if(page==='members') await showMembers();
  else if(page==='addpv') await showAddPV();
}

// ============ DATA HELPERS ============
async function getAllUsers(){
  const {data} = await sb.from('users').select('*').order('created_at');
  return data || [];
}

async function getAllPV(){
  const {data} = await sb.from('pv_records').select('*').order('created_at');
  return data || [];
}

function getDownline(userId, users){
  const direct = users.filter(u => {
    const sp = users.find(s => s.code === u.sponsor_code);
    return sp && sp.id === userId;
  });
  let all = [...direct];
  direct.forEach(d => { all = [...all, ...getDownline(d.id, users)]; });
  return all;
}

function personalPV(userId, pvRecords){
  const recs = pvRecords.filter(p => p.user_id === userId);
  const total = recs.reduce((s,p) => s+p.amount, 0);
  const now = new Date();
  const thisMonth = recs.filter(p => {
    const d = new Date(p.created_at);
    return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  }).reduce((s,p) => s+p.amount, 0);
  return {total, thisMonth};
}

function teamPV(userId, users, pvRecords){
  const down = getDownline(userId, users);
  const ids = [userId, ...down.map(u=>u.id)];
  const recs = pvRecords.filter(p => ids.includes(p.user_id));
  const total = recs.reduce((s,p) => s+p.amount, 0);
  const now = new Date();
  const thisMonth = recs.filter(p => {
    const d = new Date(p.created_at);
    return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  }).reduce((s,p) => s+p.amount, 0);
  return {total, thisMonth, memberCount: down.length};
}

function buildTreeHTML(user, users, pvRecords, depth=0){
  const pv = personalPV(user.id, pvRecords);
  const team = teamPV(user.id, users, pvRecords);
  const children = users.filter(u => {
    const sp = users.find(s => s.code === u.sponsor_code);
    return sp && sp.id === user.id;
  });
  const initials = user.full_name.split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase();
  const isSelf = user.id === currentUser.id;
  const isAdmin = user.role === 'admin';
  const circleClass = `t-circle${isSelf?' t-self':''}${isAdmin?' t-admin':''}`;
  const uid = user.id.replace(/-/g,'').substring(0,8);

  const childrenHTML = children.length ? `
    <div class="t-vert"></div>
    <div style="position:relative;width:100%">
      ${children.length > 1 ? `<div style="display:flex;justify-content:center"><div style="height:2px;background:var(--border);width:${Math.min(children.length*100,500)}px"></div></div>` : ''}
    </div>
    <div class="t-children" id="ch-${uid}">
      ${children.map(c => `
        <div class="t-branch">
          <div class="t-branch-vert"></div>
          ${buildTreeHTML(c, users, pvRecords, depth+1)}
        </div>`).join('')}
    </div>` : '';

  const toggleBtn = children.length ? `
    <button onclick="toggleNode('${uid}')" style="margin-top:6px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:2px 10px;font-size:10px;cursor:pointer;color:var(--muted)">
      ${depth<2?'▲':'▼ '+children.length+' wanachama'}
    </button>` : '';

  return `<div class="t-node">
    <div class="${circleClass}" onclick="togglePV('${uid}')" onmouseleave="hidePV('${uid}')">
      ${initials}
      <div class="t-popup" id="pv-${uid}">
        <div style="color:var(--gold);font-weight:700;margin-bottom:4px">${user.full_name}</div>
        <div>PV Mwezi: <strong style="color:#7c6aff">${pv.thisMonth}</strong></div>
        <div>PV Jumla: <strong style="color:#6affd4">${pv.total}</strong></div>
        <div>PV Team: <strong style="color:#ffd066">${team.total}</strong></div>
        <div>Wanachama: <strong style="color:#fff">${team.memberCount}</strong></div>
      </div>
    </div>
    <div class="t-label">
      <div class="t-name">${user.full_name}${isAdmin?' 👑':''}</div>
      <div class="t-id">${user.member_number}</div>
    </div>
    ${toggleBtn}
    ${childrenHTML}
  </div>`;
}

async function showAddPV(){
  const [users, pvRecords] = await Promise.all([getAllUsers(), getAllPV()]);
  const members = users.filter(u => u.role !== 'admin');

  const history = [...pvRecords].reverse().map(r => {
    const u = users.find(u => u.id === r.user_id);
    return `<tr><td>${u ? u.full_name : '—'}</td><td><span class="pv-tag">+${r.amount}</span></td><td>${r.note||'—'}</td><td>${new Date(r.created_at).toLocaleDateString('sw-TZ')}</td></tr>`;
  }).join('');
  document.getElementById('main-content').innerHTML = `
  <div class="page-title">Ongeza PV ➕</div>
  <div class="pv-form">
    <h3>Jaza PV kwa Mwanachama</h3>
    <div class="row">
      <div class="field" style="flex:2"><label>Chagua Mwanachama</label><select id="pv-user"><option value="">-- Chagua --</option>${opts}</select></div>
      <div class="field"><label>Kiasi cha PV</label><input id="pv-amount" type="number" placeholder="Mfano: 100" /></div>
    </div>
    <div class="field"><label>Maelezo (Optional)</label><input id="pv-note" placeholder="Mfano: Mauzo ya Cream" /></div>
    <div id="pv-err" class="err hidden"></div>
    <div id="pv-suc" class="suc hidden"></div>
    <button class="btn btn-success" style="width:auto;padding:11px 28px" onclick="addPV()">Ongeza PV ✅</button>
  </div>
  <div class="table-wrap">
    <div class="table-head"><div class="table-title">Historia ya PV</div></div>
    ${pvRecords.length===0 ? '<div class="empty">Hakuna rekodi bado</div>' : `<table><thead><tr><th>Mwanachama</th><th>PV</th><th>Maelezo</th><th>Tarehe</th></tr></thead><tbody>${history}</tbody></table>`}
  </div>`;
}

async function addPV(){
  hideEl('pv-err'); hideEl('pv-suc');
  const userId = document.getElementById('pv-user').value;
  const amount = Number(document.getElementById('pv-amount').value);
  const note = document.getElementById('pv-note').value || 'PV ya mauzo';
  if(!userId) return showEl('pv-err','Chagua mwanachama');
  if(!amount||amount<=0) return showEl('pv-err','Weka PV sahihi');
  const {error} = await sb.from('pv_records').insert({user_id: userId, amount, note, added_by: 'admin'});
  if(error) return showEl('pv-err','Hitilafu: '+error.message);
  showEl('pv-suc', `PV ${amount} imeongezwa! ✅`);
  document.getElementById('pv-amount').value = '';
  document.getElementById('pv-note').value = '';
  document.getElementById('pv-user').value = '';
  setTimeout(() => showAddPV(), 1500);
}

// ============ INIT ============
async function init(){
  const saved = sessionStorage.getItem('mlm_user');
  const ok = await setupDB();
  if(!ok) return;
  document.getElementById('loading-screen').classList.add('hidden');
  if(saved){
    currentUser = JSON.parse(saved);
    // Refresh user data from DB
    const {data} = await sb.from('users').select('*').eq('id', currentUser.id).single();
    if(data){ currentUser = data; sessionStorage.setItem('mlm_user', JSON.stringify(data)); loadApp(data); }
    else { document.getElementById('auth-screen').classList.remove('hidden'); }
  } else {
    document.getElementById('auth-screen').classList.remove('hidden');
  }
}

init();
